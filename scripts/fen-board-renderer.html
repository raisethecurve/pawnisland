<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FEN Board Renderer</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #181310;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

    const scenes = {
      game: {
        fen: "r3r1k1/p4ppp/2p2n2/1p6/3P1qb1/2NQR3/PPB2PP1/R1B3K1 w - - 5 18",
        camera: [5.9, 8.2, 8.8],
        target: [0.15, 0.2, 0.15],
        warm: 1.05
      },
      calculation: {
        fen: "2bq1rk1/pr3ppn/1p2p3/7P/2pP1B1P/2P5/PPQ2PB1/R3R1K1 w - -",
        camera: [-5.7, 8.3, 8.7],
        target: [-0.05, 0.15, 0.05],
        warm: 0.94
      }
    };

    const sceneKey = new URLSearchParams(location.search).get("scene") || "game";
    const active = scenes[sceneKey] || scenes.game;
    const square = 1;
    const boardTop = 0.19;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(1);
    renderer.setSize(1000, 750, true);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = active.warm;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b1a12);
    scene.fog = new THREE.Fog(0x2b1a12, 14, 26);

    const aspect = 1000 / 750;
    const frustum = 10.6;
    const camera = new THREE.OrthographicCamera(
      (frustum * aspect) / -2,
      (frustum * aspect) / 2,
      frustum / 2,
      frustum / -2,
      0.1,
      100
    );
    camera.position.set(...active.camera);
    camera.lookAt(new THREE.Vector3(...active.target));

    const ambient = new THREE.HemisphereLight(0xfff2dd, 0x1f1712, 1.75);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xffe4bf, 3.4);
    key.position.set(-4.5, 8, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 0.1;
    key.shadow.camera.far = 24;
    key.shadow.camera.left = -8;
    key.shadow.camera.right = 8;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -8;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xb8d8ff, 0.65);
    fill.position.set(5, 4, -6);
    scene.add(fill);

    const rim = new THREE.PointLight(0xffd474, 32, 18);
    rim.position.set(3.8, 4.4, -3.6);
    scene.add(rim);

    const ivoryMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xf1dfbc,
      roughness: 0.36,
      metalness: 0.02,
      clearcoat: 0.38,
      clearcoatRoughness: 0.2
    });

    const ebonyMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x161311,
      roughness: 0.28,
      metalness: 0.04,
      clearcoat: 0.46,
      clearcoatRoughness: 0.18
    });

    const goldMaterial = new THREE.MeshStandardMaterial({
      color: 0xd4a53f,
      roughness: 0.38,
      metalness: 0.18
    });

    const darkFeltMaterial = new THREE.MeshStandardMaterial({
      color: 0x0d0d0c,
      roughness: 0.76
    });

    const lightSquare = new THREE.MeshStandardMaterial({
      color: 0xd6ae75,
      roughness: 0.46,
      metalness: 0.03
    });

    const darkSquare = new THREE.MeshStandardMaterial({
      color: 0x5e3420,
      roughness: 0.5,
      metalness: 0.02
    });

    const boardRail = new THREE.MeshStandardMaterial({
      color: 0x6f3e25,
      roughness: 0.42,
      metalness: 0.02
    });

    const tableMaterial = new THREE.MeshStandardMaterial({
      color: 0x452817,
      roughness: 0.58,
      metalness: 0.01
    });

    makeTable();
    makeBoard();
    addProps();
    placePieces(active.fen);

    renderer.render(scene, camera);
    window.__renderReady = true;

    function makeTable() {
      const table = new THREE.Mesh(new THREE.BoxGeometry(24, 0.22, 18), tableMaterial);
      table.position.set(0, -0.18, 0);
      table.receiveShadow = true;
      scene.add(table);

      const grain = new THREE.Group();
      for (let i = 0; i < 58; i += 1) {
        const line = new THREE.Mesh(
          new THREE.BoxGeometry(0.018, 0.006, 17.4),
          new THREE.MeshBasicMaterial({ color: i % 2 ? 0x5a321e : 0x2c1a10, transparent: true, opacity: 0.16 })
        );
        line.position.set(-11.4 + i * 0.4, -0.064, 0);
        line.rotation.y = 0.04 * Math.sin(i);
        grain.add(line);
      }
      scene.add(grain);
    }

    function makeBoard() {
      const base = new THREE.Mesh(new THREE.BoxGeometry(9.25, 0.26, 9.25), boardRail);
      base.position.y = 0;
      base.castShadow = true;
      base.receiveShadow = true;
      scene.add(base);

      for (let rank = 0; rank < 8; rank += 1) {
        for (let file = 0; file < 8; file += 1) {
          const tile = new THREE.Mesh(
            new THREE.BoxGeometry(0.985, 0.045, 0.985),
            (rank + file) % 2 === 0 ? lightSquare : darkSquare
          );
          tile.position.set((file - 3.5) * square, boardTop, (rank - 3.5) * square);
          tile.receiveShadow = true;
          scene.add(tile);
        }
      }
    }

    function addProps() {
      const clockBody = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.75, 0.34), boardRail);
      clockBody.position.set(-4.35, 0.55, -5.05);
      clockBody.rotation.y = -0.18;
      clockBody.castShadow = true;
      scene.add(clockBody);

      for (const dx of [-0.36, 0.36]) {
        const face = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.035, 36), new THREE.MeshStandardMaterial({ color: 0xe7d9b3, roughness: 0.5 }));
        face.position.set(-4.35 + dx, 0.57, -4.86);
        face.rotation.x = Math.PI / 2;
        face.rotation.z = 0.1;
        face.castShadow = true;
        scene.add(face);
      }

      const notebook = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.05, 1.25), new THREE.MeshStandardMaterial({ color: 0xf1eadc, roughness: 0.68 }));
      notebook.position.set(4.65, 0.02, 4.3);
      notebook.rotation.y = -0.45;
      notebook.castShadow = true;
      notebook.receiveShadow = true;
      scene.add(notebook);

      const pencil = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.5, 16), new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.5 }));
      pencil.position.set(4.45, 0.14, 4.1);
      pencil.rotation.z = Math.PI / 2;
      pencil.rotation.y = -0.48;
      pencil.castShadow = true;
      scene.add(pencil);
    }

    function placePieces(fen) {
      const pieces = parseFen(fen);
      for (const item of pieces) {
        const group = createPiece(item.piece);
        group.position.set((item.file - 3.5) * square, boardTop + 0.03, (item.rankIndex - 3.5) * square);
        group.rotation.y = item.piece === item.piece.toUpperCase() ? Math.PI : 0;
        group.scale.setScalar(0.52);
        scene.add(group);
      }
    }

    function parseFen(fen) {
      const output = [];
      const ranks = fen.split(" ")[0].split("/");
      ranks.forEach((rank, rankIndex) => {
        let file = 0;
        for (const char of rank) {
          if (/\d/.test(char)) {
            file += Number(char);
          } else {
            output.push({ piece: char, file, rankIndex });
            file += 1;
          }
        }
      });
      return output;
    }

    function createPiece(piece) {
      const material = piece === piece.toUpperCase() ? ivoryMaterial : ebonyMaterial;
      const accent = piece === piece.toUpperCase() ? goldMaterial : darkFeltMaterial;
      const kind = piece.toLowerCase();
      const group = new THREE.Group();

      const body = lathe(profileFor(kind), material, 44);
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      if (kind === "p") addPawnTop(group, material);
      if (kind === "r") addRookTop(group, material);
      if (kind === "n") addKnightTop(group, material, accent);
      if (kind === "b") addBishopTop(group, material, accent);
      if (kind === "q") addQueenTop(group, material, accent);
      if (kind === "k") addKingTop(group, material, accent);

      return group;
    }

    function profileFor(kind) {
      const common = [
        [0.0, 0.0], [0.39, 0.0], [0.47, 0.08], [0.44, 0.16],
        [0.33, 0.21], [0.28, 0.31], [0.22, 0.72], [0.29, 0.84]
      ];
      const profiles = {
        p: [...common, [0.18, 0.94], [0.16, 1.07], [0.0, 1.07]],
        r: [...common, [0.34, 0.98], [0.34, 1.23], [0.0, 1.23]],
        n: [...common, [0.26, 0.98], [0.18, 1.15], [0.0, 1.15]],
        b: [...common, [0.23, 0.96], [0.31, 1.18], [0.16, 1.38], [0.0, 1.38]],
        q: [...common, [0.30, 1.02], [0.26, 1.22], [0.16, 1.36], [0.0, 1.36]],
        k: [...common, [0.31, 1.02], [0.25, 1.23], [0.15, 1.38], [0.0, 1.38]]
      };
      return profiles[kind] || profiles.p;
    }

    function lathe(points, material, segments) {
      const geometry = new THREE.LatheGeometry(points.map(([x, y]) => new THREE.Vector2(x, y)), segments);
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, material);
    }

    function addPawnTop(group, material) {
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 40, 28), material);
      head.position.y = 1.22;
      head.castShadow = true;
      group.add(head);
    }

    function addRookTop(group, material) {
      for (let i = 0; i < 6; i += 1) {
        const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.18, 0.16), material);
        const angle = (Math.PI * 2 * i) / 6;
        tooth.position.set(Math.cos(angle) * 0.26, 1.32, Math.sin(angle) * 0.26);
        tooth.rotation.y = angle;
        tooth.castShadow = true;
        group.add(tooth);
      }
    }

    function addKnightTop(group, material, accent) {
      const neck = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.52, 8, 24), material);
      neck.position.set(-0.04, 1.19, 0.04);
      neck.rotation.z = -0.28;
      neck.castShadow = true;
      group.add(neck);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.48, 0.23), material);
      head.position.set(0.06, 1.51, 0.08);
      head.rotation.z = -0.38;
      head.rotation.y = 0.14;
      head.castShadow = true;
      group.add(head);

      const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.16, 0.2), material);
      muzzle.position.set(0.22, 1.38, 0.1);
      muzzle.rotation.z = -0.5;
      muzzle.castShadow = true;
      group.add(muzzle);

      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.025, 12, 8), accent);
      eye.position.set(0.23, 1.58, 0.0);
      group.add(eye);
    }

    function addBishopTop(group, material, accent) {
      const mitre = new THREE.Mesh(new THREE.SphereGeometry(0.25, 40, 24), material);
      mitre.position.y = 1.36;
      mitre.scale.set(0.86, 1.16, 0.86);
      mitre.castShadow = true;
      group.add(mitre);

      const cut = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.36, 0.028), accent);
      cut.position.set(0, 1.43, -0.23);
      cut.rotation.z = -0.55;
      group.add(cut);
    }

    function addQueenTop(group, material, accent) {
      for (let i = 0; i < 8; i += 1) {
        const angle = (Math.PI * 2 * i) / 8;
        const bead = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 12), material);
        bead.position.set(Math.cos(angle) * 0.26, 1.48 + (i % 2) * 0.04, Math.sin(angle) * 0.26);
        bead.castShadow = true;
        group.add(bead);
      }
      const jewel = new THREE.Mesh(new THREE.SphereGeometry(0.075, 18, 12), accent);
      jewel.position.y = 1.56;
      jewel.castShadow = true;
      group.add(jewel);
    }

    function addKingTop(group, material, accent) {
      const crown = new THREE.Mesh(new THREE.SphereGeometry(0.22, 40, 24), material);
      crown.position.y = 1.43;
      crown.scale.set(0.9, 0.82, 0.9);
      crown.castShadow = true;
      group.add(crown);

      const vertical = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.34, 0.08), accent);
      vertical.position.y = 1.72;
      vertical.castShadow = true;
      group.add(vertical);

      const horizontal = new THREE.Mesh(new THREE.BoxGeometry(0.27, 0.07, 0.07), accent);
      horizontal.position.y = 1.77;
      horizontal.castShadow = true;
      group.add(horizontal);
    }
  </script>
</body>
</html>
